<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12141c"/>
      <stop offset="55%" stop-color="#171a24"/>
      <stop offset="100%" stop-color="#0e1016"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8a5b"/>
      <stop offset="100%" stop-color="#ff5f56"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1010" cy="120" r="300" fill="#ff7a4d" opacity="0.07"/>

  <!-- left column -->
  <g font-family="DejaVu Sans">
    <rect x="80" y="86" width="196" height="34" rx="17" fill="#ff7a4d" fill-opacity="0.14" stroke="#ff8a5b" stroke-opacity="0.45"/>
    <text x="102" y="109" font-size="17" font-weight="bold" fill="#ffa176" letter-spacing="2.2">CLAUDE CODE</text>

    <text x="78" y="228" font-size="112" font-weight="bold" fill="#f2f4f8" letter-spacing="-2">HOOKS</text>
    <rect x="82" y="250" width="196" height="7" rx="3.5" fill="url(#accent)"/>

    <text x="80" y="322" font-size="27" fill="#c8cddb">Configuration, không phải instruction.</text>
    <text x="80" y="364" font-size="27" fill="#c8cddb">Harness chạy, không phải model.</text>

    <g font-size="20" fill="#7e8699">
      <text x="80" y="438">“Mỗi lần X xảy ra thì Y phải xảy ra”</text>
      <text x="80" y="472" fill="#5d6478">— viết vào CLAUDE.md chỉ là cầu nguyện thôi</text>
    </g>

    <g font-family="DejaVu Sans Mono" font-size="16">
      <rect x="80" y="516" width="132" height="32" rx="6" fill="#ffffff" fill-opacity="0.05"/>
      <text x="96" y="537" fill="#8b93a7">PreToolUse</text>
      <rect x="222" y="516" width="140" height="32" rx="6" fill="#ffffff" fill-opacity="0.05"/>
      <text x="238" y="537" fill="#8b93a7">PostToolUse</text>
      <rect x="372" y="516" width="66" height="32" rx="6" fill="#ffffff" fill-opacity="0.05"/>
      <text x="388" y="537" fill="#8b93a7">Stop</text>
    </g>
  </g>

  <!-- terminal card -->
  <g>
    <rect x="668" y="150" width="470" height="330" rx="14" fill="#000000" opacity="0.35"/>
    <rect x="660" y="142" width="470" height="330" rx="14" fill="#0b0d13" stroke="#2b3040" stroke-width="1.5"/>
    <rect x="660" y="142" width="470" height="42" rx="14" fill="#181c27"/>
    <rect x="660" y="170" width="470" height="14" fill="#181c27"/>
    <circle cx="686" cy="163" r="6.5" fill="#ff5f56"/>
    <circle cx="708" cy="163" r="6.5" fill="#ffbd2e"/>
    <circle cx="730" cy="163" r="6.5" fill="#27c93f"/>
    <text x="895" y="168" font-family="DejaVu Sans Mono" font-size="14" fill="#6b7385" text-anchor="middle">settings.json</text>

    <g font-family="DejaVu Sans Mono" font-size="17">
      <text x="692" y="228" fill="#4f5768">$</text>
      <text x="714" y="228" fill="#c9cfdd">claude</text>

      <text x="692" y="272" fill="#ff8a5b">●</text>
      <text x="716" y="272" fill="#e6eaf3">Edit(</text>
      <text x="762" y="272" fill="#ffbd2e">.env</text>
      <text x="800" y="272" fill="#e6eaf3">)</text>

      <text x="716" y="306" fill="#4f5768">⎿</text>
      <text x="746" y="306" fill="#8b93a7">PreToolUse hook</text>

      <rect x="740" y="326" width="330" height="34" rx="6" fill="#ff5f56" fill-opacity="0.12"/>
      <text x="758" y="349" fill="#ff6b60">✗ blocked</text>
      <text x="866" y="349" fill="#7a8195">exit code 2</text>

      <text x="746" y="392" fill="#5d6478">File nhạy cảm, không</text>
      <text x="746" y="416" fill="#5d6478">được đụng vào.</text>
    </g>
  </g>
</svg>
