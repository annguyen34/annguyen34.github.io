    <rect x="82" y="310" width="196" height="7" rx="3.5" fill="url(#accent)"/>

    <text x="80" y="396" font-size="25" fill="#c8cddb">Context là tài nguyên khan hiếm nhất.</text>
    <text x="80" y="434" font-size="25" fill="#8b93a7">“Trông có vẻ xong” không phải là xong.</text>

    <g font-family="DejaVu Sans Mono" font-size="16">
