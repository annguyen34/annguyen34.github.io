      <text x="96" y="521" fill="#8b93a7">/compact</text>
      <rect x="196" y="500" width="90" height="32" rx="6" fill="#ffffff" fill-opacity="0.05"/>
      <text x="212" y="521" fill="#8b93a7">/rewind</text>
      <rect x="296" y="500" width="90" height="32" rx="6" fill="#ffffff" fill-opacity="0.05"/>
      <text x="312" y="521" fill="#8b93a7">/effort</text>
      <rect x="396" y="500" width="126" height="32" rx="6" fill="#ffffff" fill-opacity="0.05"/>
      <text x="412" y="521" fill="#8b93a7">plan mode</text>
    </g>
  </g>

  <!-- terminal card -->
  <g>
    <rect x="668" y="158" width="470" height="316" rx="14" fill="#000000" opacity="0.35"/>
    <rect x="660" y="150" width="470" height="316" rx="14" fill="#0b0d13" stroke="#2b3040" stroke-width="1.5"/>
    <rect x="660" y="150" width="470" height="42" rx="14" fill="#181c27"/>
    <rect x="660" y="178" width="470" height="14" fill="#181c27"/>
    <circle cx="686" cy="171" r="6.5" fill="#ff5f56"/>
    <circle cx="708" cy="171" r="6.5" fill="#ffbd2e"/>
    <circle cx="730" cy="171" r="6.5" fill="#27c93f"/>
    <text x="895" y="176" font-family="DejaVu Sans Mono" font-size="14" fill="#6b7385" text-anchor="middle">claude</text>

